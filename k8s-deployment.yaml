# Rancher sandbox deployment — long polling, outbound-only (no Service/NodePort needed)
#
# Secret is created by command, not stored in git:
#   kubectl create secret generic position-sizing-bot-secret \
#     --from-literal=bot-token=<NEW_TOKEN_FROM_BOTFATHER> -n sandbox
#
# Deploy:
#   kubectl apply -f k8s-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customsupp
  namespace: sandbox
  labels:
    app: customsupp
spec:
  replicas: 1   # must stay 1 — two pollers on one token conflict (409)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: customsupp
  template:
    metadata:
      labels:
        app: customsupp
    spec:
      containers:
      - name: customsupp
        image: localhost:30445/customsupp:1.2
        imagePullPolicy: Always
        env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: customsupp-secret
              key: bot-token
        - name: BOT_MODE
          value: "polling"
        - name: TZ
          value: "Asia/Kuala_Lumpur"
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
