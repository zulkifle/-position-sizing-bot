# Rancher sandbox deployment — long polling, outbound-only (no Service/NodePort needed)
#
# Secret is created by command, not stored in git:
#   kubectl create secret generic customsupp-secret \
#     --from-literal=bot-token=<NEW_TOKEN_FROM_BOTFATHER> \
#     --from-literal=anthropic-api-key=<ANTHROPIC_API_KEY> -n sandbox
#
# Secret already exists (bot-token only)? Add the Anthropic key without touching the token:
#   kubectl patch secret customsupp-secret -n sandbox \
#     -p '{"stringData":{"anthropic-api-key":"<ANTHROPIC_API_KEY>"}}'
#
# Deploy:
#   kubectl apply -f k8s-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customsupp
  namespace: sandbox
  labels:
    app: customsupp
spec:
  replicas: 1   # must stay 1 — two pollers on one token conflict (409)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: customsupp
  template:
    metadata:
      labels:
        app: customsupp
    spec:
      containers:
      - name: customsupp
        image: localhost:30445/customsupp:1.3
        imagePullPolicy: Always
        env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: customsupp-secret
              key: bot-token
        - name: BOT_MODE
          value: "polling"
        # FCPO morning brief (Mon-Fri). Without the key it sends the scorecard only.
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: customsupp-secret
              key: anthropic-api-key
              optional: true
        - name: FCPO_BRIEF_CHAT_ID
          value: ""          # send /chatid to the bot, paste the number here
        - name: FCPO_BRIEF_TIME
          value: "09:45"     # MYT, before the 10:30 FCPO open
        - name: FCPO_BRIEF_MODEL
          value: "claude-opus-5-5"
        - name: TZ
          value: "Asia/Kuala_Lumpur"
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi   # anthropic SDK + scheduler
